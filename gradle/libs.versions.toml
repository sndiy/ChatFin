[versions]
# Core
agp                         = "8.9.0"
kotlin                      = "2.1.10"
ksp                         = "2.1.10-1.0.31"

# Compose
composeBom                  = "2026.06.01"
activityCompose             = "1.10.1"
navigationCompose           = "2.8.9"

# Lifecycle & ViewModel
lifecycle                   = "2.8.7"

# Hilt (DI)
hilt                        = "2.55"
hiltNavigationCompose       = "1.2.0"

# Room (Local DB)
room                        = "2.7.0"

# DataStore
datastore                   = "1.1.3"

# Security
securityCrypto              = "1.1.0-alpha06"

# Firebase
firebaseBom                 = "34.10.0"

# Networking (panggilan REST langsung ke Gemini API — SDK com.google.ai.client.generativeai
# sudah deprecated Google, lihat GeminiClient.kt untuk konteks migrasi)
okhttp                       = "5.4.0"

# Charts
vico                        = "2.1.2"

# Kotlin Coroutines
coroutines                  = "1.10.1"

# WorkManager
workManager                 = "2.10.0"

# Kotlin Serialization
serialization               = "1.8.0"

# CameraX & ML Kit
camerax                     = "1.4.1"
mlkitTextRecognition        = "16.0.1"
guava                       = "33.4.0-android"

# Testing
junit                       = "4.13.2"
junitExt                    = "1.2.1"
espresso                    = "3.6.1"
turbine                     = "1.2.0"
mockk                       = "1.14.3"


[libraries]
# Compose BOM — satu versi untuk semua library Compose
compose-bom                 = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui                  = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics         = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling          = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview  = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-manifest    = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-ui-test-junit4      = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-material3           = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons      = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-animation           = { group = "androidx.compose.animation", name = "animation" }
activity-compose            = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
navigation-compose          = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Lifecycle
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose   = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-runtime-ktx       = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }

# Hilt
hilt-android                = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-android-compiler       = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose     = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Room
room-runtime                = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx                    = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler               = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing                = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# DataStore
datastore-preferences       = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Security
security-crypto             = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# Firebase
# Catatan: sejak Firebase BOM ~25.12, artefak "-ktx" jadi tombstone tanpa versi
# (ekstensi Kotlin sudah menyatu ke artefak dasar). Firebase BOM 34.x menegaskan
# ini — pakai firebase-firestore / firebase-auth, bukan varian -ktx.
firebase-bom                = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-firestore          = { group = "com.google.firebase", name = "firebase-firestore" }
firebase-auth               = { group = "com.google.firebase", name = "firebase-auth" }

# Networking
okhttp                       = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

# Charts (Vico - Compose native)
vico-compose                = { group = "com.patrykandpatrick.vico", name = "compose-m3", version.ref = "vico" }

# Coroutines
coroutines-android          = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# WorkManager
work-runtime-ktx            = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }

# CameraX
camera-core                 = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camera-camera2              = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camera-lifecycle            = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camera-view                 = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
guava                       = { group = "com.google.guava", name = "guava", version.ref = "guava" }

# ML Kit OCR (Bundled 100% Offline)
mlkit-text-recognition      = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkitTextRecognition" }

# Serialization
kotlinx-serialization-json  = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# Testing
junit                       = { group = "junit", name = "junit", version.ref = "junit" }
junit-ext                   = { group = "androidx.test.ext", name = "junit", version.ref = "junitExt" }
espresso                    = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
coroutines-test              = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
turbine                     = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
mockk                       = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
mockk-android               = { group = "io.mockk", name = "mockk-android", version.ref = "mockk" }


[plugins]
android-application         = { id = "com.android.application", version.ref = "agp" }
android-library             = { id = "com.android.library", version.ref = "agp" }
kotlin-android              = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose              = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization        = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-parcelize            = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
hilt                        = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp                         = { id = "com.google.devtools.ksp", version.ref = "ksp" }
google-services             = { id = "com.google.gms.google-services", version = "4.4.2" }